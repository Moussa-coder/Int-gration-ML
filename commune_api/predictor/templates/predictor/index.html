<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Prédiction Budget Communal</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      max-width: 900px;
      margin: 40px auto;
      padding: 30px;
      background-color: #f8f9fa;
      color: #333;
      transition: background-color 0.4s, color 0.4s;
    }

    h1 {
      text-align: center;
      margin-bottom: 30px;
      color: #2c3e50;
    }

    .dark-mode {
      background-color: #1e1e1e;
      color: #eaeaea;
    }

    .dark-mode input,
    .dark-mode select,
    .dark-mode button {
      background-color: #2c2c2c;
      color: #fff;
      border: 1px solid #555;
    }

    label {
      font-weight: bold;
      margin-top: 15px;
    }

    input, select {
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 6px;
      width: 100%;
      margin-top: 5px;
      font-size: 1rem;
      background-color: #fff;
      transition: all 0.3s ease;
    }

    button {
      margin-top: 20px;
      padding: 12px;
      background-color: #3498db;
      color: #fff;
      border: none;
      border-radius: 6px;
      font-size: 1rem;
      font-weight: bold;
      cursor: pointer;
      transition: background-color 0.3s;
    }

    button:hover {
      background-color: #2980b9;
    }

    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      justify-content: center;
      margin-top: 20px;
    }

    .controls button {
      background-color: #2ecc71;
    }

    .controls button:hover {
      background-color: #27ae60;
    }

    .dark-mode .controls button {
      background-color: #3b7c57;
    }

    #resultat {
      background-color: #ecf0f1;
      border-radius: 6px;
      padding: 15px;
      margin-top: 20px;
      font-size: 1.1rem;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
    }

    .dark-mode #resultat {
      background-color: #2c2c2c;
    }

    canvas {
      margin-top: 30px;
      background: #fff;
      border-radius: 6px;
      box-shadow: 0 2px 12px rgba(0, 0, 0, 0.05);
      padding: 10px;
    }
  </style>
</head>
<body>

  <h1>🔍 Prédiction du budget d’une commune</h1>

  <form id="formulaire">
    <label for="commune">Commune :</label>
    <select id="commune" name="commune" required>
      <option value="Paris">Paris</option>
      <option value="Toulouse">Toulouse</option>
      <option value="Marseille">Marseille</option>
      <option value="Lyon">Lyon</option>
      <option value="Bordeaux">Bordeaux</option>
      <option value="Nice">Nice</option>
      <option value="Nantes">Nantes</option>
      <option value="Lille">Lille</option>
      <option value="Rennes">Rennes</option>
      <option value="Reims">Reims</option>
      <option value="Toulon">Toulon</option>
      <option value="Dijon">Dijon</option>
      <option value="Angers">Angers</option>
      <option value="Montpellier">Montpellier</option>
    </select>

    <label for="annee">Année future :</label>
    <input type="number" id="annee" name="annee" placeholder="Ex : 2026" required>

    <button type="submit">📊 Prédire</button>
  </form>

  <div class="controls">
    <button onclick="toggleDarkMode()">🌓 Mode clair/sombre</button>
    <button onclick="exportGraph()">📤 Exporter le graphique</button>
  </div>

  <div id="resultat"></div>

  <canvas id="chart" height="200"></canvas>
  <canvas id="chart_historique" height="300"></canvas>

  <script>
    let barChart = null;
    let lineChart = null;

    document.getElementById("formulaire").onsubmit = async (e) => {
      e.preventDefault();

      const commune = document.getElementById("commune").value;
      const annee = document.getElementById("annee").value;

      const res = await fetch("/predict/", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ commune, annee })
      });
      const data = await res.json();

      if (res.ok) {
        document.getElementById("resultat").innerHTML =
          `<strong>Recettes :</strong> ${data.recettes} M€<br>` +
          `<strong>Dépenses :</strong> ${data.depenses} M€`;

        const ctx = document.getElementById("chart").getContext("2d");
        if (barChart) barChart.destroy();
        barChart = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: ['Recettes', 'Dépenses'],
            datasets: [{
              label: `Prévision ${annee} pour ${commune}`,
              data: [data.recettes, data.depenses],
              backgroundColor: ['#4CAF50', '#F44336']
            }]
          },
          options: {
            responsive: true,
            scales: {
              y: {
                beginAtZero: true,
                title: { display: true, text: 'Montant (en millions €)' }
              }
            }
          }
        });

        const histoRes = await fetch("/historique/", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ commune, annee })
        });
        const histo = await histoRes.json();

        const ctx2 = document.getElementById("chart_historique").getContext("2d");
        if (lineChart) lineChart.destroy();
        lineChart = new Chart(ctx2, {
          type: 'line',
          data: {
            labels: histo.annees,
            datasets: [
              {
                label: "Recettes",
                data: histo.recettes,
                borderColor: "#4CAF50",
                fill: false,
                tension: 0.3
              },
              {
                label: "Dépenses",
                data: histo.depenses,
                borderColor: "#F44336",
                fill: false,
                tension: 0.3
              }
            ]
          },
          options: {
            responsive: true,
            plugins: {
              title: {
                display: true,
                text: `Historique + Prédiction (${commune})`
              }
            }
          }
        });
      } else {
        document.getElementById("resultat").innerHTML =
          `<span style="color:red;">Erreur : ${data.error || "requête invalide"}</span>`;
      }
    };

    function toggleDarkMode() {
      document.body.classList.toggle("dark-mode");
    }

    function exportGraph() {
      const canvas = document.getElementById("chart_historique");
      const image = canvas.toDataURL("image/png");
      const link = document.createElement("a");
      link.href = image;
      link.download = "graphique_budget.png";
      link.click();
    }
  </script>

</body>
</html>
